<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Зворотний лічильник</title>
    <link rel="stylesheet" href="./css/counter.css" />
  </head>
  <body>
    <div class="container">
      <h1>До події залишилось:</h1>
      <div id="countdown">
        <span id="days">00</span> днів <span id="hours">00</span> годин
        <span id="minutes">00</span> хвилин <span id="seconds">00</span> секунд
      </div>
      <button id="subscribeBtn">Підписатися</button>
      <p id="message"></p>
    </div>

    <script src="./js/counter.js"></script>
  </body>
</html>
